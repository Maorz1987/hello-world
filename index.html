<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    body {
      background: #6b21a8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #logo {
      position: fixed;
      top: 0;
      left: 0;
      font-size: 3rem;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      will-change: transform;
    }
  </style>
</head>
<body>
  <div id="logo">Hello World</div>
  <script>
    (function () {
      var logo = document.getElementById('logo');
      var colors = [
        '#ffffff', '#f9c80e', '#43aa8b', '#f86624',
        '#277da1', '#ff5da2', '#90be6d', '#ffd6a5'
      ];
      var ci = 0;

      var x = 40, y = 40;
      var vx = 2.4, vy = 2.4;

      function bounds() {
        return {
          w: window.innerWidth - logo.offsetWidth,
          h: window.innerHeight - logo.offsetHeight
        };
      }

      function nextColor() {
        ci = (ci + 1) % colors.length;
        logo.style.color = colors[ci];
      }

      function tick() {
        var b = bounds();
        x += vx;
        y += vy;

        var hit = false;
        if (x <= 0) { x = 0; vx = Math.abs(vx); hit = true; }
        else if (x >= b.w) { x = b.w; vx = -Math.abs(vx); hit = true; }
        if (y <= 0) { y = 0; vy = Math.abs(vy); hit = true; }
        else if (y >= b.h) { y = b.h; vy = -Math.abs(vy); hit = true; }
        if (hit) nextColor();

        logo.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
        requestAnimationFrame(tick);
      }

      window.addEventListener('resize', function () {
        var b = bounds();
        if (x > b.w) x = b.w;
        if (y > b.h) y = b.h;
      });

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
